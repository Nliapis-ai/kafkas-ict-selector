<head>

<style>
:root{

  --color-text-tertiary:#9ca3af;--color-text-info:#1a6fb5;
  --color-text-success:#2e7d32;--color-text-warning:#b45309;
  --color-text-danger:#c0392b;
  --color-border-primary:#374151;--color-border-secondary:#d1d5db;
  --color-border-tertiary:#e5e7eb;--color-border-info:#90caf9;
  --color-border-success:#a5d6a7;--color-border-warning:#fcd34d;
  --color-border-danger:#f48fb1;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'SF Mono','Fira Code',monospace;
  --border-radius-sm:4px;--border-radius-md:6px;--border-radius-lg:10px;
}
@media(prefers-color-scheme:dark){
  :root{
    --color-background-primary:#1e1e2e;--color-background-secondary:#2a2a3e;
    --color-background-info:#1a3a5c;--color-background-success:#1b3a1f;
    --color-background-warning:#3a2e00;--color-background-danger:#3a1a1a;
    --color-text-primary:#e8e8f0;--color-text-secondary:#9ca3af;
    --color-text-tertiary:#6b7280;--color-text-info:#90caf9;
    --color-text-success:#a5d6a7;--color-text-warning:#fcd34d;
    --color-text-danger:#f48fb1;
    --color-border-secondary:#374151;--color-border-tertiary:#2d2d3e;
    --color-border-info:#1a6fb5;--color-border-success:#2e7d32;
    --color-border-warning:#b45309;--color-border-danger:#c0392b;

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--color-background-secondary);min-height:100vh;padding:16px}
#app{max-width:860px;margin:0 auto;padding:0 0 2rem}
.kh{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.1rem;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.kl{font-size:13px;color:var(--color-text-secondary)}.kl b{color:var(--color-text-primary)}
.ver{font-size:10px;color:var(--color-text-tertiary);margin-left:6px}
.kh-actions{display:flex;gap:6px;align-items:center}
.kr{background:none;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:4px 10px;font-size:12px;cursor:pointer;color:var(--color-text-secondary)}
.kr:hover{background:var(--color-background-secondary)}
.stabs{display:flex;gap:5px;margin-bottom:1rem;flex-wrap:wrap}
.stb{padding:5px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);font-size:12px;cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary);font-weight:500;transition:all .15s}
.stb.on{background:var(--color-background-primary);border-color:var(--color-border-secondary);color:var(--color-text-primary);box-shadow:inset 0 -2px 0 var(--color-border-info)}
.subtabs{display:flex;gap:5px;margin-bottom:.85rem}
.subtb{padding:4px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);font-size:11px;cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary)}
.subtb.on{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.crumb{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-height:30px;padding:.35rem .6rem;background:var(--color-background-secondary);border-radius:var(--border-radius-md);margin-bottom:.85rem}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:2px 6px;font-size:11px}

.step{margin-bottom:.75rem}
.slbl{font-size:10px;font-weight:500;letter-spacing:.07em;color:var(--color-text-secondary);text-transform:uppercase;margin-bottom:.35rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:5px}
.opt{padding:.45rem .75rem;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;background:var(--color-background-primary);text-align:left;width:100%;transition:all .1s}
.opt:hover:not([disabled]){border-color:var(--color-border-info);background:var(--color-background-info)}
.opt.sel{border-color:var(--color-border-info);background:var(--color-background-info)}
.opt[disabled]{opacity:.3;cursor:not-allowed}
.ot{font-size:12px;font-weight:500;color:var(--color-text-primary);margin-bottom:1px}
.os{font-size:11px;color:var(--color-text-secondary)}
.div{height:.5px;background:var(--color-border-tertiary);margin:1rem 0}

.pg{display:grid;gap:5px}

.warn{font-size:11px;color:var(--color-text-warning);background:var(--color-background-warning);border-radius:var(--border-radius-md);padding:.4rem .65rem;margin-top:.4rem}
.info{font-size:11px;color:var(--color-text-info);background:var(--color-background-info);border-radius:var(--border-radius-md);padding:.4rem .65rem;margin-top:.4rem}

.acc-card{display:flex;align-items:center;gap:7px;padding:.45rem .7rem;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;background:var(--color-background-primary);transition:all .1s}

.acc-cb{width:15px;height:15px;border:1px solid var(--color-border-secondary);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px}

.qty-input{width:52px;padding:3px 6px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:12px;font-family:var(--font-mono);text-align:center}

.export-footer{display:flex;align-items:center;gap:10px;padding:.5rem .75rem}

.pin-screen{display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;gap:1rem}
.pin-dots{display:flex;gap:10px}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--color-border-secondary)}

.pin-btn{padding:.65rem;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:15px;font-weight:500;cursor:pointer;text-align:center}
.pin-btn:hover{background:var(--color-background-primary);border-color:var(--color-border-info)}
.pin-error{font-size:11px;color:var(--color-text-danger);background:var(--color-background-danger);padding:4px 12px;border-radius:var(--border-radius-md)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s ease}
/* Admin */

.anav{padding:4px 10px;border-radius:var(--border-radius-md);font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary)}
.anav.on{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.lock-btn{padding:4px 9px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-danger);font-size:11px;cursor:pointer;background:none;color:var(--color-text-danger)}
.adm-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem;flex-wrap:wrap;gap:7px}
.af{padding:3px 9px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);font-size:11px;cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary)}

.btn{padding:4px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);font-size:11px;cursor:pointer;font-weight:500}
.btn-add{background:var(--color-background-success);color:var(--color-text-success);border-color:var(--color-border-success)}
.btn-rst{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.btn-del{background:none;border:none;cursor:pointer;color:var(--color-text-danger);font-size:12px;padding:2px 4px;border-radius:3px}

.btn-edit{background:none;border:none;cursor:pointer;color:var(--color-text-info);font-size:12px;padding:2px 4px;border-radius:3px}

.btn-save{padding:4px 9px;border-radius:var(--border-radius-md);background:var(--color-background-success);color:var(--color-text-success);border:0.5px solid var(--color-border-success);font-size:11px;cursor:pointer}

.adm-form{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:.75rem;margin-bottom:.75rem}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:5px;margin-bottom:.55rem}
.fi{display:flex;flex-direction:column;gap:3px}
.fi label{font-size:10px;color:var(--color-text-secondary);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.fi input,.fi select{padding:4px 7px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:11px;font-family:var(--font-mono);width:100%}

// ══ MUTABLE DATA (loaded from API)

let RACKS=[], SHELVES={}, ACCS=[];

// ═══════════════════════════════════════════════════════════
// ══ API FUNCTIONS (Google Sheets)
// ═══════════════════════════════════════════════════════════
function showLoading(v){
  document.getElementById('loading-overlay').style.display = v ? 'flex' : 'none';
}
function showOffline(v){
  document.getElementById('offline-banner').style.display = v ? 'block' : 'none';
}

async function loadAll(){
  showLoading(true);
  showOffline(false);
  try{
    const resp = await fetch(`${API_URL}?t=${Date.now()}`);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();

    RACKS  = (data.racks  && data.racks.length)       ? data.racks  : DEFAULT_RACKS.map(x=>({...x}));
    ACCS   = (data.accessories && data.accessories.length) ? data.accessories : DEFAULT_ACCS.map(x=>({...x}));

    // Shelves: API returns array, HTML uses obj keyed by dep
    if(data.shelves && data.shelves.length){
      SHELVES = {};
      data.shelves.forEach(s => { if(s.dep) SHELVES[parseInt(s.dep)] = s; });
    } else {
      SHELVES = JSON.parse(JSON.stringify(DEFAULT_SHELVES));
    }

    admPin = data.pin || '1234';

    // Cache locally
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({racks:RACKS, shelves:SHELVES, accs:ACCS, ts:Date.now()})); }catch(e){}

  } catch(err){
    console.warn('API unavailable, using cache:', err);
    try{
      const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if(cache){ RACKS=cache.racks; SHELVES=cache.shelves; ACCS=cache.accs; showOffline(true); }
      else { RACKS=DEFAULT_RACKS.map(x=>({...x})); SHELVES=JSON.parse(JSON.stringify(DEFAULT_SHELVES)); ACCS=DEFAULT_ACCS.map(x=>({...x})); showOffline(true); }
    }catch(e2){ RACKS=DEFAULT_RACKS.map(x=>({...x})); SHELVES=JSON.parse(JSON.stringify(DEFAULT_SHELVES)); ACCS=DEFAULT_ACCS.map(x=>({...x})); }
  } finally{
    showLoading(false);
  }
  renderApp();
}

async function saveData(key, data, msg){
  // Build full payload (always sync all data)
  const payload = {
    racks:       RACKS,
    shelves:     Object.values(SHELVES),
    accessories: ACCS
  };
  if(key==='pin') payload.pin = admPin;

  // Update local cache immediately
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({racks:RACKS, shelves:SHELVES, accs:ACCS, ts:Date.now()})); }catch(e){}

  // POST to API (fire & forward — text/plain avoids CORS preflight)
  try{
    fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
      mode:'no-cors'
    });
    if(msg) flashAdm(msg + ' ☁️');
  }catch(err){
    console.warn('API save failed (local cache updated):', err);
    if(msg) flashAdm(msg + ' (local)');
  }
}

function flashAdm(t){
  const el=document.getElementById('adm-smsg');
  if(el){el.textContent=t;el.style.opacity='1';setTimeout(()=>{el.style.opacity='0';},2500);}
}

async function refreshData(){
  const btn=document.getElementById('refresh-btn');
  if(btn){btn.textContent='⏳';btn.disabled=true;}
  await loadAll();
  if(btn){btn.textContent='🔄';btn.disabled=false;}
}

function eqKey(it){return(it.id||it.pn||it.sap)+'_'+(it.co||it.cat||it.fi||'')+'_'+(it.sh||'');}
function renderExportBox(items){
  if(!items||!items.length)return'';
  items.forEach(it=>{const k=eqKey(it);if(exportQtys[k]===undefined)exportQtys[k]=it._qty??1;});
  const rows=items.map(it=>{const k=eqKey(it),q=exportQtys[k]??1;const sapEl=String(it.sap).startsWith('⚠')?`<span style="color:var(--color-text-warning)">${it.sap}</span>`:it.sap;return`<tr class="${q==0?'dim':''}"><td class="export-sap">${sapEl}</td><td class="export-pn">${it.pn}</td><td class="export-desc">${it.d}</td><td><input class="qty-input" type="number" min="0" max="999" value="${q}" data-k="${k}" onchange="exportQtys[this.dataset.k]=parseInt(this.value)||0;this.closest('tr').className=parseInt(this.value)?'':'dim'"/></td></tr>`;}).join('');
  return`<div class="export-box"><div class="export-header"><span class="export-title"><i class="ti ti-clipboard-list"></i> Λίστα Παραγγελίας</span><span style="font-size:11px;color:var(--color-text-tertiary)">${items.length} αντικ.</span></div><div style="overflow-x:auto"><table class="export-table"><thead><tr><th>SAP</th><th>P/N</th><th>Περιγραφή</th><th>Qty</th></tr></thead><tbody>${rows}</tbody></table></div><div class="export-footer"><button class="copy-btn" onclick="copyTSV(${JSON.stringify(items).replace(/"/g,"'")})"><i class="ti ti-copy"></i> Αντιγραφή TSV</button><span id="copy-msg" class="copy-msg"></span></div></div>`;
}
async function copyTSV(items){
  const lines=['SAP\tP/N\tΠεριγραφή\tQty'];
  items.forEach(it=>{const k=eqKey(it),q=exportQtys[k]??1;if(q>0)lines.push(`${it.sap}\t${it.pn}\t${it.d}\t${q}`);});
  try{await navigator.clipboard.writeText(lines.join('\n'));const m=document.getElementById('copy-msg');if(m){m.textContent='✓ Αντιγράφηκε!';m.style.opacity='1';setTimeout(()=>{m.style.opacity='0';},2500);}}
  catch(e){alert('Αντιγράψτε χειροκίνητα:\n\n'+lines.join('\n'));}
}

function fl(pn){return String(pn)[0].toUpperCase();}
function genericCard(it,qty,url){
  const isCen=it.br==='Central'||it.sr==='Central';
  const bc=it.tp==='ip55'?'bIP':it.br==='Rittal'?'bR':isCen?'bC':'bP';
  const badge=it.tp==='ip55'?'IP55':(it.br||'Panduit');
  const qEl=qty&&qty>1?`<span class="qty-b">${qty}×</span>`:'';
  const sapEl=String(it.sap).startsWith('⚠')?`<span style="color:var(--color-text-warning);font-size:9px">${it.sap}</span>`:`<div class="ps">${it.sap}</div>`;
  const link=url||it.url||'#';
  return`<div class="pc"><div>${sapEl}</div><div class="pm"><a class="pp" href="${link}" target="_blank">${qEl}${it.pn} <i class="ti ti-external-link" style="font-size:9px"></i></a><div class="pd">${it.d}</div></div><span class="pb ${bc}">${badge}</span></div>`;
}
function getJacks(kp,cat,shield){
  if(!kp.length||!cat||!shield)return[];
  const isKP=kp.some(p=>p.sr==='KP');
  const isCentralOnly=kp.every(p=>p.br==='Central');
  const isPanduitOnly=kp.every(p=>p.br==='Panduit');
  const hasPanduitCP=kp.some(p=>p.br==='Panduit'&&p.sr==='MiniCom');
  return CU_JACKS.filter(j=>{
    if(j.cat!==cat||j.sh!==shield)return false;
    if(isKP&&kp.every(p=>p.sr==='KP'))return j.sr==='KP';
    if(isCentralOnly)return j.sr==='Central';
    // ★ Panduit μόνο → χωρίς Central jacks
    if(isPanduitOnly){const L=new Set(kp.map(p=>fl(p.pn)));return L.has(fl(j.pn))&&j.sr!=='KP';}
    // Αμφότερα → Panduit + Central
    if(hasPanduitCP){const L=new Set(kp.filter(p=>p.br==='Panduit').map(p=>fl(p.pn)));return(L.has(fl(j.pn))&&j.sr!=='KP')||(j.sr==='Central');}
    const L=new Set(kp.filter(p=>p.br==='Panduit').map(p=>fl(p.pn)));
    return(j.sr==='Central'||(L.has(fl(j.pn))&&j.sr!=='KP'));
  }).filter((j,i,a)=>a.findIndex(x=>x.sap===j.sap&&x.pn===j.pn)===i);
}

function cuCf(k){if(cuMode==='panel'){const o=['cat','shield','type','brand'];o.slice(o.indexOf(k)).forEach(x=>delete cuSel[x]);}else{const o=['mounting','pos','series','cat','shield'];o.slice(o.indexOf(k)).forEach(x=>delete cuOSel[x]);}exportQtys={};renderApp();}
function cuCh(k,v){
  if(cuMode==='panel'){const o=['cat','shield','type','brand'];o.slice(o.indexOf(k)+1).forEach(x=>delete cuSel[x]);cuSel[k]=v;}
  else{const o=['mounting','pos','series','cat','shield'];o.slice(o.indexOf(k)+1).forEach(x=>delete cuOSel[x]);cuOSel[k]=v;if(cuOSel.series==='NetKey')cuOSel.shield='UTP';}
  exportQtys={};renderApp();
}
function renderCopper(){
  const s=document.getElementById('main-content');if(!s)return;
  let html=`<div class="subtabs"><button class="subtb${cuMode==='panel'?' on':''}" onclick="cuMode='panel';cuSel={};exportQtys={};renderApp()">📋 Patch Panel</button><button class="subtb${cuMode==='outlet'?' on':''}" onclick="cuMode='outlet';cuOSel={};exportQtys={};renderApp()">🔌 Outlet / Πριζάκι</button></div>`;
  if(cuMode==='panel'){
    function pOpts(k){
      const tmp={...cuSel};delete tmp[k];
      const base=CU_PANELS.filter(p=>{if(tmp.cat&&!p.cats.includes(tmp.cat))return false;if(tmp.shield&&!p.shields.includes(tmp.shield))return false;if(tmp.type&&p.tp!==tmp.type)return false;if(tmp.brand&&tmp.brand!=='all'&&p.br!==tmp.brand)return false;return true;});
      if(k==='cat')return['Cat5e','Cat6','Cat6A'].map(v=>({v,t:v,s:'',dis:!base.some(p=>p.cats.includes(v))}));
      if(k==='shield')return[{v:'UTP',t:'UTP',s:'Αθωράκιστο'},{v:'SHP',t:'Θωρακισμένα',s:'F/UTP · U/FTP · S/FTP'}].map(o=>({...o,dis:!base.some(p=>p.shields.includes(o.v))}));
      if(k==='type')return[{v:'keystone',t:'Keystone',s:'Κενό'},{v:'prewired',t:'Pre-wired',s:'Γεμάτο'}].map(o=>({...o,dis:!base.some(p=>p.tp===o.v)}));
      if(k==='brand')return[{v:'Panduit',t:'Panduit',s:'Επαγγελ.'},{v:'Central',t:'Central',s:'Οικον.'},{v:'all',t:'Αμφότερα',s:''}].map(o=>({...o,dis:o.v!=='all'&&!base.some(p=>p.br===o.v)}));
      return[];
    }
    const steps=[{k:'cat',lbl:'1. Κατηγορία',opts:()=>pOpts('cat')},{k:'shield',lbl:'2. Θωράκιση',opts:()=>pOpts('shield')},{k:'type',lbl:'3. Τύπος',opts:()=>pOpts('type')},{k:'brand',lbl:'4. Brand',opts:()=>pOpts('brand')}];
    const done=Object.keys(cuSel).filter(k=>cuSel[k]),next=steps.find(s=>!done.includes(s.k));
    const lnames={cat:'Κατηγορία',shield:'Θωράκιση',type:'Τύπος',brand:'Brand'};
    const crumb=done.length?done.map((k,i)=>`${i?'<span class="csep">›</span>':''}<span class="chip"><span style="font-size:10px;color:var(--color-text-secondary)">${lnames[k]||k}:</span> <b>${cuSel[k]==='SHP'?'Θωρακισμένα':cuSel[k]}</b><button onclick="cuCf('${k}')">×</button></span>`).join(''):'<span style="color:var(--color-text-tertiary);font-size:11px"><i class="ti ti-filter"></i> Επέλεξε κριτήρια</span>';
    let wiz='';
    steps.forEach(st=>{if(!done.includes(st.k)&&st!==next)return;const opts=st.opts();wiz+=`<div class="step"><div class="slbl">${st.lbl}</div><div class="opts">${opts.map(o=>`<button class="opt${cuSel[st.k]===o.v?' sel':''}" onclick="cuCh('${st.k}','${o.v}')"${o.dis?' disabled':''}><div class="ot">${o.t}</div><div class="os">${o.s||''}</div></button>`).join('')}</div></div>`;});
    html+=`<div class="crumb">${crumb}</div>${wiz}`;
    if(done.length>=2){
      const panels=CU_PANELS.filter(p=>{if(cuSel.cat&&!p.cats.includes(cuSel.cat))return false;if(cuSel.shield&&!p.shields.includes(cuSel.shield))return false;if(cuSel.type&&p.tp!==cuSel.type)return false;if(cuSel.brand&&cuSel.brand!=='all'&&p.br!==cuSel.brand)return false;return true;}).filter((p,i,a)=>a.findIndex(x=>x.sap===p.sap&&x.pn===p.pn)===i);
      const kp=panels.filter(p=>p.tp==='keystone');
      const jacks=getJacks(kp,cuSel.cat,cuSel.shield);
      const isKPonly=kp.length&&kp.every(p=>p.sr==='KP');
      const centralShpJack=jacks.find(j=>j.centralShpNote);
      html+=`<div class="div"></div>`;
      if(panels.length)html+=`<div class="sl">Patch Panels (${panels.length})</div><div class="pg">${panels.map(p=>genericCard(p,1)).join('')}</div>`;
      if(isKPonly)html+=`<div class="warn">⚠️ KP24WSBL: ΜΟΝΟ με KJS6X88TC.</div>`;
      if(jacks.length)html+=`<div class="sl">Συμβατά Jacks</div><div class="pg">${jacks.map(j=>genericCard(j,1)).join('')}</div>`;
      if(centralShpJack)html+=`<div class="info"><i class="ti ti-info-circle"></i> <b>15-18-12/T</b>: Συμβατό με όλα τα θωρακισμένα καλώδια και με όλα τα κενά Central panels.</div>`;

      html+=renderExportBox([...panels.map(p=>({...p,_qty:1})),...jacks.map(j=>({...j,_qty:24}))]);

function foEff(fi,co){if(fi==='OS2'&&(co==='LC-APC'||co==='SC-APC'))return'OS2-APC';return fi;}
function foFm(pFi,fi,co){const ef=foEff(fi,co);return pFi.includes(ef)||pFi.includes(fi);}
function foAd(fi){return(fi==='OM3'||fi==='OM4')?'MM':fi;}
function foCf(k){if(foMode==='panel'){const o=['fi','co','sr','nf'];o.slice(o.indexOf(k)).forEach(x=>delete foSel[x]);}else{const o=['fi','co','bp','nf'];o.slice(o.indexOf(k)).forEach(x=>delete foBSel[x]);}exportQtys={};renderApp();}
function foCh(k,v){if(foMode==='panel'){const o=['fi','co','sr','nf'];o.slice(o.indexOf(k)+1).forEach(x=>delete foSel[x]);foSel[k]=v;}else{const o=['fi','co','bp','nf'];o.slice(o.indexOf(k)+1).forEach(x=>delete foBSel[x]);foBSel[k]=v;}exportQtys={};renderApp();}
function foFap(fi,co,N){const mods=FO_FAPS.filter(m=>m.fi.includes(fi)&&m.co===co).sort((a,b)=>b.p-a.p);if(!mods.length)return null;const best=mods[0],n=Math.ceil((N/2)/best.p);return{mod:best,qty:n,blanks:Math.max(0,4-n)};}
function foMinP(sr,N){return(sr==='PLUS'||sr==='BASIC')?N:Math.ceil(N/2);}

// ══ RACKS MODULE
// ═══════════════════════════════════════════════════════════
function rEtp(){if(rSel.ip==='ip')return'ip55';if(rSel.size==='small')return'wall';return rSel.tp||null;}
function rCf(k){const o=['ip','size','tp','u','dims'];o.slice(o.indexOf(k)).forEach(x=>delete rSel[x]);rCk.clear();exportQtys={};renderApp();}
function rCh(k,v){const o=['ip','size','tp','u','dims'];o.slice(o.indexOf(k)+1).forEach(x=>delete rSel[x]);rSel[k]=v;rCk.clear();exportQtys={};renderApp();}
function rTog(id){if(rCk.has(id))rCk.delete(id);else rCk.add(id);renderApp();}
function rGetU(tp){return[...new Set(RACKS.filter(r=>r.tp===tp).map(r=>r.u))].sort((a,b)=>a-b).map(u=>({v:String(u),t:`${u}U`,s:`≈${Math.round(u*44.45/100)/10}m`}));}
function rGetD(tp,u){return[...new Set(RACKS.filter(r=>r.tp===tp&&r.u===parseInt(u)).map(r=>`${r.w}×${r.dep}`))].sort().map(d=>{const[w,dp]=d.split('×');return{v:d,t:`${w}×${dp}mm`,s:''};});}
function renderRacks(){
  const s=document.getElementById('main-content');if(!s)return;

  let vis=['ip'];

  const done=Object.keys(rSel).filter(k=>rSel[k]);
  const next=vis.find(k=>!done.includes(k));
  const rLn={ip:'IP',size:'Μέγεθος',tp:'Τύπος',u:'U',dims:'Διαστ.'};
  const rVM={std:'Standard',ip:'IP55/66',small:'<22U',large:'≥22U',srv:'Server',rittal:'Rittal'};
  const crumbKeys=done.filter(k=>k!=='tp'||!isIP);
  const crumb=crumbKeys.length?crumbKeys.map((k,i)=>`${i?'<span class="csep">›</span>':''}<span class="chip"><span style="font-size:10px;color:var(--color-text-secondary)">${rLn[k]||k}:</span> <b>${rVM[rSel[k]]||rSel[k]}</b><button onclick="rCf('${k}')">×</button></span>`).join(''):'<span style="color:var(--color-text-tertiary);font-size:11px"><i class="ti ti-filter"></i> Επέλεξε κριτήρια</span>';
  let wiz='';
  vis.forEach(sk=>{
    if(!done.includes(sk)&&sk!==next)return;
    let opts=[],lbl={ip:'1. IP Rating',size:'2. Μέγεθος',tp:'3. Τύπος',u:'4. U',dims:'5. Διαστάσεις'}[sk];
    if(sk==='ip')opts=[{v:'std',t:'Standard IP20',s:''},{v:'ip',t:'IP-rated IP55/IP66',s:'Rittal μόνο'}];
    if(sk==='size')opts=[{v:'small',t:'< 22U Επιτοίχιο',s:isIP?'Μη διαθέσιμο':'',dis:isIP},{v:'large',t:'≥ 22U Επιδαπέδιο',s:''}];
    if(sk==='tp')opts=[{v:'std',t:'Τηλεπικοιν.',s:'Central'},{v:'srv',t:'Server Rack',s:'Central'},{v:'rittal',t:'Rittal Premium',s:'VX IT / TS IT'}];
    if(sk==='u'&&tp)opts=rGetU(tp);
    if(sk==='dims'&&tp&&rSel.u)opts=rGetD(tp,rSel.u);
    const cur=sk==='u'?rSel.u:sk==='dims'?rSel.dims:rSel[sk];
    wiz+=`<div class="step"><div class="slbl">${lbl}</div><div class="opts">${opts.map(o=>`<button class="opt${cur===o.v?' sel':''}" onclick="rCh('${sk}','${o.v}')"${o.dis?' disabled':''}><div class="ot">${o.t}</div><div class="os">${o.s||''}</div></button>`).join('')}</div></div>`;
  });
  let html=`<div class="crumb">${crumb}</div>${wiz}`;
  if(tp&&rSel.u&&(isSmall||rSel.dims)){
    let racks;
    if(isSmall)racks=RACKS.filter(r=>r.tp==='wall'&&r.u===parseInt(rSel.u));
    else{const[w,dp]=rSel.dims.split('×').map(Number);racks=RACKS.filter(r=>r.tp===tp&&r.u===parseInt(rSel.u)&&r.w===w&&r.dep===dp);}
    const dep=racks.length?racks[0].dep:600;
    const shelf=SHELVES[dep]||SHELVES[600];const allAccs=shelf?[shelf,...ACCS]:ACCS;
    html+=`<div class="div"></div><div class="sl">Rack (${racks.length})</div>`;
    html+=racks.length?`<div class="pg">${racks.map(r=>{const isIP2=r.tp==='ip55',isBay=r.pn.includes('Baying'),bc=isBay?'bIP':isIP2?'bIP':r.br==='Rittal'?'bR':'bC',badge=isBay?'IP66':isIP2?'IP55':r.br;return`<div class="pc"><div><div class="ps">${r.sap}</div></div><div class="pm"><a class="pp" href="${r.url||'#'}" target="_blank">${r.pn} <i class="ti ti-external-link" style="font-size:9px"></i></a><div class="pd">${r.d}</div></div><span class="pb ${bc}">${badge}</span></div>`;}).join('')}</div>`:`<div class="none">Δεν βρέθηκε.</div>`;
    if(racks.some(r=>r.tp==='ip55'))html+=`<div class="note">IP55/IP66 — Rittal order codes.</div>`;
    html+=`<div class="sl" style="margin-top:.85rem">Παρελκόμενα</div><div class="note" style="margin-bottom:.35rem">Ράφι: αυτόματα βάσει βάθους ${dep}mm.</div>`;
    html+=`<div class="acc-grid">${allAccs.map(a=>{const on=rCk.has(a.id);const sapEl=String(a.sap).startsWith('⚠')?`<span style="color:var(--color-text-warning);font-size:9px">${a.sap}</span>`:`<div class="acc-sap">${a.sap}</div>`;return`<div class="acc-card${on?' on':''}" onclick="rTog('${a.id}')"><div class="acc-cb">${on?'✓':''}</div><div style="min-width:0;overflow:hidden"><div class="acc-pn">${a.pn}</div><div class="acc-d">${a.d}</div>${sapEl}</div></div>`;}).join('')}</div>`;
    const expItems=[...racks.map(r=>({...r,_qty:1})),...allAccs.filter(a=>rCk.has(a.id)).map(a=>({...a,_qty:1}))];
    html+=renderExportBox(expItems);
  }
  s.innerHTML=html;
}

// ═══════════════════════════════════════════════════════════
// ══ ADMIN MODULE
// ═══════════════════════════════════════════════════════════
function pinPress(d){if(pinBuf.length>=4)return;pinBuf+=d;renderAdmin();if(pinBuf.length===4){setTimeout(()=>{if(pinBuf===admPin){admAuth=true;pinBuf='';pinErr='';renderAdmin();}else{pinErr='Λάθος PIN';pinBuf='';const pd=document.getElementById('pindots');if(pd){pd.classList.add('shake');setTimeout(()=>pd.classList.remove('shake'),400);}renderAdmin();}},200);}}
function pinDel(){if(pinBuf.length)pinBuf=pinBuf.slice(0,-1);renderAdmin();}
function pinLock(){admAuth=false;pinBuf='';pinErr='';renderAdmin();}
const IS_DEF=new Set(DEFAULT_RACKS.map(r=>r.pn));
const TP_L={wall:'Επιτ.',std:'Τηλεπ.',srv:'Server',rittal:'Rittal',ip55:'IP55+'};
const TP_C={wall:'tp-wall',std:'tp-std',srv:'tp-srv',rittal:'tp-rittal',ip55:'tp-ip55'};
function admRackDel(pn){if(!confirm(`Διαγραφή "${pn}";`))return;RACKS=RACKS.filter(r=>r.pn!==pn);saveData('racks',RACKS,'✓ Διαγράφηκε');renderAdmin();}
function admRackEd(i){rackEditIdx=i;rackEditForm={...RACKS[i]};showRackForm=false;renderAdmin();}
function admRackCan(){rackEditIdx=null;rackEditForm={};renderAdmin();}
function admRackSav(){if(!rackEditForm.sap||!rackEditForm.pn)return;RACKS[rackEditIdx]={...rackEditForm,u:parseInt(rackEditForm.u),w:parseInt(rackEditForm.w),dep:parseInt(rackEditForm.dep),_mod:true};rackEditIdx=null;saveData('racks',RACKS,'✓ Αποθηκεύτηκε ☁️');renderAdmin();}
function admRackAdd(){if(!rackAddForm.sap||!rackAddForm.pn)return;const ei=RACKS.findIndex(r=>r.pn===rackAddForm.pn);const nr={...rackAddForm,u:parseInt(rackAddForm.u),w:parseInt(rackAddForm.w),dep:parseInt(rackAddForm.dep),_cust:true,url:'https://www.central-telecom.gr/Product/6'};ei>=0?RACKS[ei]=nr:RACKS.push(nr);rackAddForm={sap:'',pn:'',d:'',br:'Central',tp:'std',u:42,w:600,dep:600};showRackForm=false;saveData('racks',RACKS,'✓ Προστέθηκε ☁️');renderAdmin();}
function admRackRst(){if(!confirm('Επαναφορά;'))return;RACKS=DEFAULT_RACKS.map(r=>({...r}));rackEditIdx=null;showRackForm=false;saveData('racks',RACKS,'✓ Επαναφορά ☁️');renderAdmin();}
function rfv(f,v){if(rackEditIdx!==null)rackEditForm[f]=v;else rackAddForm[f]=v;}
function admShEd(dep){shelfEditDep=dep;shelfEditForm={...SHELVES[dep]};renderAdmin();}
function admShSav(){SHELVES[shelfEditDep]={...shelfEditForm,dep:parseInt(shelfEditDep)};shelfEditDep=null;saveData('shelves',SHELVES,'✓ Ράφι αποθηκεύτηκε ☁️');renderAdmin();}
function admShCan(){shelfEditDep=null;renderAdmin();}
function sfv(f,v){shelfEditForm[f]=v;}
function admAccEd(id){accEditId=id;accEditForm={...ACCS.find(x=>x.id===id)};showAccForm=false;renderAdmin();}
function admAccSav(){const i=ACCS.findIndex(x=>x.id===accEditId);if(i>=0)ACCS[i]={...accEditForm,_mod:true};accEditId=null;saveData('accs',ACCS,'✓ Αποθηκεύτηκε ☁️');renderAdmin();}
function admAccCan(){accEditId=null;renderAdmin();}
function admAccDel(id){if(!confirm('Διαγραφή;'))return;ACCS=ACCS.filter(x=>x.id!==id);saveData('accs',ACCS,'✓ Διαγράφηκε ☁️');renderAdmin();}
function admAccAdd(){if(!accAddForm.id||!accAddForm.sap||!accAddForm.pn)return;ACCS.push({...accAddForm,_cust:true});accAddForm={id:'',sap:'',pn:'',d:''};showAccForm=false;saveData('accs',ACCS,'✓ Προστέθηκε ☁️');renderAdmin();}
function admAccRst(){if(!confirm('Επαναφορά παρελκομένων;'))return;ACCS=DEFAULT_ACCS.map(x=>({...x}));accEditId=null;saveData('accs',ACCS,'✓ Επαναφορά ☁️');renderAdmin();}
function afv(f,v){if(accEditId)accEditForm[f]=v;else accAddForm[f]=v;}
function admPinSav(){const{cur,n1,n2}=pinChangeForm;if(cur!==admPin){alert('Λάθος τρέχων PIN');return;}if(n1.length<4||!/^\d+$/.test(n1)){alert('4+ ψηφία');return;}if(n1!==n2){alert('Δεν ταιριάζουν');return;}admPin=n1;pinChangeForm={cur:'',n1:'',n2:''};saveData('pin',null,'✓ PIN αλλάχτηκε ☁️');renderAdmin();}
function rFH(fd,isEd){return`<div class="adm-form"><div style="font-size:12px;font-weight:600;margin-bottom:.5rem">${isEd?'✏️ Edit':'➕ Νέο'}</div><div class="form-grid"><div class="fi"><label>SAP *</label><input value="${fd.sap||''}" oninput="rfv('sap',this.value)"/></div><div class="fi"><label>P/N *</label><input value="${fd.pn||''}" oninput="rfv('pn',this.value)"/></div><div class="fi wide"><label>Περιγραφή</label><input value="${fd.d||''}" oninput="rfv('d',this.value)"/></div><div class="fi"><label>Brand</label><select onchange="rfv('br',this.value)"><option${(fd.br||'')==='Central'?' selected':''}>Central</option><option${(fd.br||'')==='Rittal'?' selected':''}>Rittal</option></select></div><div class="fi"><label>Τύπος</label><select onchange="rfv('tp',this.value)"><option value="wall"${fd.tp==='wall'?' selected':''}>wall</option><option value="std"${(fd.tp||'std')==='std'?' selected':''}>std</option><option value="srv"${fd.tp==='srv'?' selected':''}>srv</option><option value="rittal"${fd.tp==='rittal'?' selected':''}>rittal</option><option value="ip55"${fd.tp==='ip55'?' selected':''}>ip55</option></select></div><div class="fi"><label>U</label><input type="number" value="${fd.u||42}" oninput="rfv('u',this.value)" min="1" max="55"/></div><div class="fi"><label>Πλάτος</label><select onchange="rfv('w',this.value)"><option value="540"${(fd.w||600)==540?' selected':''}>540</option><option value="600"${(fd.w||600)==600?' selected':''}>600</option><option value="800"${(fd.w||600)==800?' selected':''}>800</option></select></div><div class="fi"><label>Βάθος</label><select onchange="rfv('dep',this.value)"><option value="600"${(fd.dep||600)==600?' selected':''}>600</option><option value="800"${(fd.dep||600)==800?' selected':''}>800</option><option value="1000"${(fd.dep||600)==1000?' selected':''}>1000</option><option value="1200"${(fd.dep||600)==1200?' selected':''}>1200</option></select></div></div><div class="form-actions">${isEd?`<button class="btn-save" onclick="admRackSav()">💾 Αποθήκευση</button><button class="btn-cancel" onclick="admRackCan()">✕</button>`:`<button class="btn-save" onclick="admRackAdd()">+ Προσθήκη</button><button class="btn-cancel" onclick="showRackForm=false;renderAdmin()">✕</button>`}</div></div>`;}
function renderAdmin(){
  const s=document.getElementById('main-content');if(!s)return;
  if(!admAuth){s.innerHTML=`<div class="pin-screen"><div style="font-size:2.5rem;color:var(--color-text-tertiary)"><i class="ti ti-lock"></i></div><div style="font-size:15px;font-weight:600;color:var(--color-text-primary)">Περιοχή Διαχείρισης</div><div style="font-size:12px;color:var(--color-text-secondary)">Εισάγετε κωδικό πρόσβασης</div><div id="pindots" class="pin-dots">${[0,1,2,3].map(i=>`<div class="pin-dot${pinBuf.length>i?' f':''}"></div>`).join('')}</div>${pinErr?`<div class="pin-error">${pinErr}</div>`:''}<div class="pin-pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button class="pin-btn" ${k===''?'disabled':''} onclick="${k==='⌫'?'pinDel()':'pinPress('+k+')'}">${k}</button>`).join('')}</div>${admPin==='1234'?`<div class="note" style="font-size:11px;margin-top:8px">⚠️ Default PIN: <b>1234</b> — αλλάξτε από Ρυθμίσεις.</div>`:''}</div>`;return;}
  const filtered=admFlt==='all'?RACKS:RACKS.filter(r=>r.tp===admFlt);
  const TFL=['all','wall','std','srv','rittal','ip55'],TLB={all:'Όλα',wall:'Επιτ.',std:'Τηλεπ.',srv:'Server',rittal:'Rittal',ip55:'IP55+'};
  let content='';
  if(admSec==='racks'){
    const rows=filtered.map(r=>{const ri=RACKS.indexOf(r);if(rackEditIdx===ri)return`<tr style="background:var(--color-background-info)"><td colspan="7">${rFH(rackEditForm,true)}</td></tr>`;const cust=!IS_DEF.has(r.pn)||r._mod;return`<tr><td class="td-sap">${r.sap}</td><td class="td-pn">${r.pn}</td><td style="font-size:11px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-text-secondary)">${r.d}</td><td><span class="tp-badge ${TP_C[r.tp]||''}">${TP_L[r.tp]||r.tp}</span></td><td style="font-size:10px;color:var(--color-text-secondary)">${r.u}U·${r.w}×${r.dep}</td><td><span class="${cust?'badge-cust':'badge-def'}">${cust?'C':'D'}</span></td><td class="td-acts"><button class="btn-edit" onclick="admRackEd(${ri})" title="Edit"><i class="ti ti-pencil"></i></button><button class="btn-del" onclick="admRackDel('${r.pn}')" title="Delete"><i class="ti ti-trash"></i></button></td></tr>`;}).join('');
    content=`<div class="adm-bar"><div style="display:flex;gap:4px;flex-wrap:wrap">${TFL.map(f=>`<button class="af${admFlt===f?' on':''}" onclick="admFlt='${f}';renderAdmin()">${TLB[f]}${f==='all'?' ('+RACKS.length+')':''}</button>`).join('')}</div><div style="display:flex;gap:5px"><button class="btn btn-add" onclick="showRackForm=!showRackForm;rackEditIdx=null;renderAdmin()"><i class="ti ti-plus"></i> Νέο</button><button class="btn btn-rst" onclick="admRackRst()" title="Reset to defaults"><i class="ti ti-refresh"></i></button></div></div>${showRackForm&&rackEditIdx===null?rFH(rackAddForm,false):''}<div style="overflow-x:auto"><table class="adm-table"><thead><tr><th>SAP</th><th>P/N</th><th>Περιγραφή</th><th>Τύπος</th><th>U×Δ</th><th></th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7" style="text-align:center;padding:1.5rem;color:var(--color-text-tertiary)">Κανένα</td></tr>'}</tbody></table></div><div style="font-size:11px;color:var(--color-text-tertiary);margin-top:.4rem;text-align:right">${filtered.length} εγγραφές</div>`;
  }
  if(admSec==='accs'){
    const shRows=Object.values(SHELVES).map(sv=>{if(shelfEditDep==sv.dep)return`<div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:5px;align-items:end;margin-bottom:5px"><div class="fi"><label>SAP</label><input value="${shelfEditForm.sap||''}" oninput="sfv('sap',this.value)"/></div><div class="fi"><label>P/N</label><input value="${shelfEditForm.pn||''}" oninput="sfv('pn',this.value)"/></div><div class="fi"><label>Περιγραφή</label><input value="${shelfEditForm.d||''}" oninput="sfv('d',this.value)"/></div><div style="display:flex;gap:4px;padding-bottom:2px"><button class="btn-save" onclick="admShSav()">💾</button><button class="btn-cancel" onclick="admShCan()">✕</button></div></div>`;return`<div class="inline-row"><span class="il">${sv.dep}mm</span><span class="il">${sv.sap}</span><span class="il">${sv.pn}</span><button class="btn-edit" onclick="admShEd(${sv.dep})"><i class="ti ti-pencil"></i></button></div>`;}).join('');
    const accAddHtml=showAccForm?`<div class="adm-form"><div style="font-size:11px;font-weight:600;margin-bottom:.45rem">➕ Νέο Παρελκόμενο</div><div class="form-grid"><div class="fi"><label>ID (unique)</label><input value="${accAddForm.id}" oninput="afv('id',this.value)" placeholder="π.χ. fan2"/></div><div class="fi"><label>SAP</label><input value="${accAddForm.sap}" oninput="afv('sap',this.value)"/></div><div class="fi"><label>P/N</label><input value="${accAddForm.pn}" oninput="afv('pn',this.value)"/></div><div class="fi wide"><label>Περιγραφή</label><input value="${accAddForm.d}" oninput="afv('d',this.value)"/></div></div><div class="form-actions"><button class="btn-save" onclick="admAccAdd()">+ Προσθήκη</button><button class="btn-cancel" onclick="showAccForm=false;renderAdmin()">✕</button></div></div>`:'';
    const accRows=ACCS.map(a=>{const isDef=DEFAULT_ACCS.some(d=>d.id===a.id);if(accEditId===a.id)return`<tr style="background:var(--color-background-info)"><td colspan="4"><div style="display:grid;grid-template-columns:80px 120px 1fr auto;gap:5px;align-items:end;padding:4px 0"><div class="fi"><label>SAP</label><input value="${accEditForm.sap||''}" oninput="afv('sap',this.value)"/></div><div class="fi"><label>P/N</label><input value="${accEditForm.pn||''}" oninput="afv('pn',this.value)"/></div><div class="fi"><label>Περιγραφή</label><input value="${accEditForm.d||''}" oninput="afv('d',this.value)"/></div><div style="display:flex;gap:4px;padding-bottom:2px"><button class="btn-save" onclick="admAccSav()">💾</button><button class="btn-cancel" onclick="admAccCan()">✕</button></div></div></td></tr>`;return`<tr><td class="td-sap">${a.sap}</td><td class="td-pn">${a.pn}</td><td style="font-size:11px;color:var(--color-text-secondary)">${a.d}</td><td class="td-acts"><button class="btn-edit" onclick="admAccEd('${a.id}')"><i class="ti ti-pencil"></i></button>${!isDef?`<button class="btn-del" onclick="admAccDel('${a.id}')"><i class="ti ti-trash"></i></button>`:''}</td></tr>`;}).join('');
    content=`<div class="section-card"><h4><i class="ti ti-box"></i> Ράφια ανά βάθος rack</h4>${shRows}</div><div class="section-card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem"><h4 style="margin:0"><i class="ti ti-tool"></i> Παρελκόμενα Racks</h4><div style="display:flex;gap:5px"><button class="btn btn-add" onclick="showAccForm=!showAccForm;accEditId=null;renderAdmin()"><i class="ti ti-plus"></i></button><button class="btn btn-rst" onclick="admAccRst()"><i class="ti ti-refresh"></i></button></div></div>${accAddHtml}<div style="overflow-x:auto"><table class="adm-table"><thead><tr><th>SAP</th><th>P/N</th><th>Περιγραφή</th><th></th></tr></thead><tbody>${accRows}</tbody></table></div></div>`;
  }
  if(admSec==='pin'){content=`<div class="section-card" style="max-width:300px"><h4><i class="ti ti-key"></i> Αλλαγή PIN</h4><div class="pin-change-form"><div class="fi"><label>Τρέχων PIN</label><input type="password" maxlength="10" value="${pinChangeForm.cur}" oninput="pinChangeForm.cur=this.value"/></div><div class="fi"><label>Νέος PIN (4+ ψηφία)</label><input type="password" maxlength="10" value="${pinChangeForm.n1}" oninput="pinChangeForm.n1=this.value"/></div><div class="fi"><label>Επιβεβαίωση νέου PIN</label><input type="password" maxlength="10" value="${pinChangeForm.n2}" oninput="pinChangeForm.n2=this.value"/></div><button class="btn-save" style="width:fit-content;margin-top:8px" onclick="admPinSav()">💾 Αλλαγή PIN</button></div>${admPin==='1234'?`<div class="warn" style="margin-top:.75rem">⚠️ Χρησιμοποιείτε default PIN 1234. Αλλάξτε τον.</div>`:''}<div class="note" style="margin-top:.75rem"><i class="ti ti-cloud"></i> Το PIN αποθηκεύεται στο Google Sheets.</div></div>`;}
  s.innerHTML=`<div class="adm-hdr"><div style="display:flex;gap:5px"><button class="anav${admSec==='racks'?' on':''}" onclick="admSec='racks';renderAdmin()">🗄 Racks</button><button class="anav${admSec==='accs'?' on':''}" onclick="admSec='accs';renderAdmin()">🔧 Παρελκ/να</button><button class="anav${admSec==='pin'?' on':''}" onclick="admSec='pin';renderAdmin()">🔑 PIN</button></div><div style="display:flex;align-items:center;gap:8px"><span id="adm-smsg" class="save-msg" style="opacity:0"></span><button class="lock-btn" onclick="pinLock()"><i class="ti ti-lock"></i> Κλείδωμα</button></div></div>${content}`;
}

// ═══════════════════════════════════════════════════════════
// ══ MAIN
// ═══════════════════════════════════════════════════════════
const TABS=[{id:'copper',lbl:'🔌 Χαλκός'},{id:'fo',lbl:'💡 FO'},{id:'racks',lbl:'🗄 Racks'},{id:'admin',lbl:'🔒 Admin'}];
function switchTab(t){activeTab=t;renderApp();}
function renderApp(){
  const te=document.getElementById('main-tabs');
  if(te)te.innerHTML=TABS.map(t=>`<button class="stb${activeTab===t.id?' on':''}" onclick="switchTab('${t.id}')">${t.lbl}</button>`).join('');
  if(activeTab==='copper')renderCopper();
  else if(activeTab==='fo')renderFO();
  else if(activeTab==='racks')renderRacks();
  else renderAdmin();
}
document.getElementById('brst').onclick=()=>{
  if(activeTab==='copper'){cuSel={};cuOSel={};}
  else if(activeTab==='fo'){foSel={};foBSel={};}
  else if(activeTab==='racks'){rSel={};rCk.clear();}
  exportQtys={};renderApp();
};
loadAll();
</script>
